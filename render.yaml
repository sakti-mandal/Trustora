services:
  # Web Service (FastAPI + React frontend unified bundle)
  - type: web
    name: trustora-app
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustora-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENV
        value: production

databases:
  # Hosted PostgreSQL Database
  - name: trustora-db
    plan: free
    region: oregon
    databaseName: trustora
    user: trustora_user
