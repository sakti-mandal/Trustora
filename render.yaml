services:
  # Web Service (Unified FastAPI + React SPA with Multi-Stage Docker Build)
  - type: web
    name: trustora-app
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustora-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ENV
        value: production

databases:
  # Hosted PostgreSQL Database
  - name: trustora-db
    plan: free
    region: oregon
    databaseName: trustora
    user: trustora_user
